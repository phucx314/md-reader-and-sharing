[package]
name = "md-reader"
version = "0.1.0"
description = "MD Reader — brutalist markdown reader for Linux"
authors = ["phucx314"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "md_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs"] }
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
